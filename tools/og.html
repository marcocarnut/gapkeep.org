<!DOCTYPE html>
<!-- The social card (site/img/og.png, 1200x630), made by tools/make_og.sh. -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: M; src: url("../site/fonts/montserrat-var.woff2"); font-weight: 100 900; }
@font-face { font-family: J; src: url("../site/fonts/jetbrainsmono-regular.woff2"); }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #1d1c23; color: #ecebf2; font-family: M; }

p { font-size: 22px; color: #b0aec0; margin: 0; line-height: 1.45; }

.mon { background: #0d0d11; border-radius: 16px; padding: 14px; box-shadow: 0 30px 70px -20px #000, 0 0 0 1px #3a3844 inset; }

<div>
  <img class="lock" src="../site/img/logo/finder-lockup.svg" alt="">

  <p>A Raspberry Pi Zero that boots in about two seconds and keeps nothing.</p>

</div>
